name: Temporary lockfile refresh

on:
  push:
    branches:
      - hardening/zero-gap-2026-09

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/hardening/zero-gap-2026-09'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --progress=false
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git add package-lock.json
          git commit -m "chore(deps): refresh npm lockfile"
          git push origin HEAD:hardening/zero-gap-2026-09
