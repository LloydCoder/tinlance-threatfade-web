name: Phase 19 formatter diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --progress=false
      - run: npx prettier --write app/enterprise/security/page.tsx app/enterprise/procurement/page.tsx docs/PHASE_19_ENTERPRISE_SCALE.md lib/enterprise/model.ts tests/enterprise-model.test.ts
      - run: git diff --no-ext-diff -- app/enterprise/security/page.tsx app/enterprise/procurement/page.tsx docs/PHASE_19_ENTERPRISE_SCALE.md lib/enterprise/model.ts tests/enterprise-model.test.ts
