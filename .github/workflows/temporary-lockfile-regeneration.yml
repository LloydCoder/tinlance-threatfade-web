name: Temporary lockfile regeneration

on:
  push:
    branches:
      - feat/security-dependency-refresh

permissions:
  contents: write

concurrency:
  group: lockfile-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout dependency-refresh branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Regenerate complete npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --progress=false --fetch-timeout=60000 --fetch-retries=2

      - name: Commit lockfile only when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already reconciled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): regenerate lockfile for security patches"
          git push origin HEAD:${GITHUB_REF_NAME}
