name: Phase 13 Format Fix

on:
  push:
    branches: [phase-13-authenticated-platform]

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Format Phase 13 files
        run: npx prettier --write app/account/page.tsx app/api/analyst/'[...path]'/route.ts app/api/auth/'[...nextauth]'/route.ts app/api/identity/'[...path]'/route.ts app/login/page.tsx app/organizations/'[id]'/page.tsx app/organizations/page.tsx auth.ts lib/auth-engine.ts lib/auth-security.ts proxy.ts tests/unit/auth-security.test.ts types/next-auth.d.ts package.json
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app auth.ts lib proxy.ts tests/unit/auth-security.test.ts types/next-auth.d.ts package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(phase13): apply Prettier formatting"
          git push origin HEAD:phase-13-authenticated-platform
