name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e

  phase6_format_repair:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/phase6-playground' && github.actor == 'LloydCoder'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Format Phase 6 files
        run: npx prettier --write app/api/playground/route.ts app/playground/page.tsx components/playground/playground-client.tsx lib/playground.ts tests/e2e/playground.spec.ts tests/unit/playground-route.test.ts tests/unit/playground.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/playground/route.ts app/playground/page.tsx components/playground/playground-client.tsx lib/playground.ts tests/e2e/playground.spec.ts tests/unit/playground-route.test.ts tests/unit/playground.test.ts
          git commit -m 'style(phase6): format playground'
          git push origin HEAD:feat/phase6-playground
