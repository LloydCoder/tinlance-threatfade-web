name: Format Preview
on:
  push:
    branches: [feat/phase7-enterprise-conversion]
permissions:
  contents: read
jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npx prettier --write app/enterprise/page.tsx docs/analytics/conversion-events.md
      - name: Print formatted files
        run: |
          cat app/enterprise/page.tsx
          printf '\n---DOC---\n'
          cat docs/analytics/conversion-events.md
