name: Format Preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write app/enterprise/page.tsx
      - run: git diff --no-color -- app/enterprise/page.tsx
