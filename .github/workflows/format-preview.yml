name: Format Preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prettier --version
      - run: npx prettier --check app/enterprise/page.tsx
      - run: npx prettier@3.6.2 --check app/enterprise/page.tsx
      - run: npx prettier@3.9.6 --check app/enterprise/page.tsx
