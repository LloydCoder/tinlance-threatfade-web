name: Phase 16 format fix

on:
  push:
    branches: [phase-16-research-content-scale]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'LloydCoder/tinlance-threatfade-web' && github.ref == 'refs/heads/phase-16-research-content-scale'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --progress=false --fetch-timeout=60000 --fetch-retries=2
      - run: npx prettier --write README.md app/changelog/page.tsx app/research/[slug]/page.tsx app/research/challenge/page.tsx app/research/page.tsx app/sitemap.ts components/research/research-components.tsx components/research/research-index.tsx config/seo-topics.ts content/research/index.ts docs/research/editorial-governance.md tests/e2e/phase16-research.spec.ts tests/unit/research-content.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md app/changelog/page.tsx app/research/[slug]/page.tsx app/research/challenge/page.tsx app/research/page.tsx app/sitemap.ts components/research/research-components.tsx components/research/research-index.tsx config/seo-topics.ts content/research/index.ts docs/research/editorial-governance.md tests/e2e/phase16-research.spec.ts tests/unit/research-content.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(phase16): format research scale files"
          git push origin HEAD:phase-16-research-content-scale
