name: Hotfix formatter

on:
  push:
    branches: [hotfix/oidc-config-degraded-auth]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'LloydCoder/tinlance-threatfade-web' && github.ref == 'refs/heads/hotfix/oidc-config-degraded-auth'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write 'app/api/auth/[...nextauth]/route.ts'
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add 'app/api/auth/[...nextauth]/route.ts'
          git commit -m "style(hotfix): format auth route"
          git push origin HEAD:hotfix/oidc-config-degraded-auth
