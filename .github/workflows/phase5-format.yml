name: Phase 5 format repair

on:
  push:
    branches: [feat/phase5-docs]

permissions:
  contents: write

jobs:
  format:
    if: github.actor == 'LloydCoder' && !startsWith(github.event.head_commit.message, 'style(phase5): format')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format changed documentation files
        run: npx prettier --write app/docs config/docs.ts content/docs components/docs lib/docs.ts tests/unit/docs*.test.ts app/sitemap.ts docs/PHASE-5-DOCUMENTATION.md

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/docs config/docs.ts content/docs components/docs lib/docs.ts tests/unit/docs*.test.ts app/sitemap.ts docs/PHASE-5-DOCUMENTATION.md
          git commit -m "style(phase5): format documentation platform"
          git push origin HEAD:feat/phase5-docs
