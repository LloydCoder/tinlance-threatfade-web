name: Phase 18 format fix

on:
  push:
    branches: [phase18-customer-value-expansion]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          ref: phase18-customer-value-expansion
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: true
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write app/account/customer/page.tsx app/api/customer-value/request/route.ts app/contact/page.tsx lib/customer-value/model.test.ts lib/customer-value/model.ts lib/analytics/taxonomy.ts docs/PHASE_18_CUSTOMER_VALUE.md
      - name: Commit formatted files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/account/customer/page.tsx app/api/customer-value/request/route.ts app/contact/page.tsx lib/customer-value/model.test.ts lib/customer-value/model.ts lib/analytics/taxonomy.ts docs/PHASE_18_CUSTOMER_VALUE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(phase18): apply repository prettier formatting"
          git push origin HEAD:phase18-customer-value-expansion
