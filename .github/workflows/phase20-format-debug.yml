name: Phase 20 format debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase20-independent-assurance
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write app/enterprise/assurance/page.tsx app/enterprise/security/page.tsx lib/assurance/model.ts
      - run: git diff -- app/enterprise/assurance/page.tsx app/enterprise/security/page.tsx lib/assurance/model.ts
