name: Phase 20 format debug

on:
  push:
    branches: [phase20-independent-assurance]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase20-independent-assurance
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write app/enterprise/assurance/page.tsx app/enterprise/security/page.tsx lib/assurance/model.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain -- app/enterprise/assurance/page.tsx app/enterprise/security/page.tsx lib/assurance/model.ts)" ]]; then
            git add app/enterprise/assurance/page.tsx app/enterprise/security/page.tsx lib/assurance/model.ts
            git commit -m "style: apply Prettier to Phase 20 assurance UI"
            git push origin HEAD:phase20-independent-assurance
          fi
