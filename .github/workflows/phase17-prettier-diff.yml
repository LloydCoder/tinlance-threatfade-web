name: Phase 17 Prettier Diff Helper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --progress=false
      - run: npx prettier --write app/account/demand/page.tsx app/api/demand-intelligence/score/route.ts app/demand/[problem]/page.tsx lib/demand-intelligence/compliance.test.ts lib/demand-intelligence/compliance.ts lib/demand-intelligence/landing-pages.ts lib/demand-intelligence/model.test.ts lib/demand-intelligence/model.ts
      - run: git diff --no-ext-diff -- app/account/demand/page.tsx app/api/demand-intelligence/score/route.ts 'app/demand/[problem]/page.tsx' lib/demand-intelligence/compliance.test.ts lib/demand-intelligence/compliance.ts lib/demand-intelligence/landing-pages.ts lib/demand-intelligence/model.test.ts lib/demand-intelligence/model.ts
