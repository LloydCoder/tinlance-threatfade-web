name: Phase 3 Prettier Output

on:
  pull_request:
    paths:
      - "app/api/analyst/**"
      - "app/soc/**"
      - "config/site.ts"

permissions:
  contents: read

jobs:
  prettier-output:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Print canonical output
        run: |
          npx --yes prettier@3.9.6 app/api/analyst/[...path]/route.ts
          npx --yes prettier@3.9.6 app/soc/page.tsx
          npx --yes prettier@3.9.6 app/soc/[id]/page.tsx
