name: Phase 3 Prettier Fix

on:
  pull_request:
    paths:
      - "app/api/analyst/**"
      - "app/soc/**"
      - "config/site.ts"

permissions:
  contents: write

jobs:
  prettier-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Format changed SOC files
        run: |
          npx --yes prettier@3.9.6 --write app/api/analyst/[...path]/route.ts app/soc/page.tsx app/soc/[id]/page.tsx
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --quiet; then exit 0; fi
          git add app/api/analyst/[...path]/route.ts app/soc/page.tsx app/soc/[id]/page.tsx
          git commit -m "style: format phase 3 SOC web files"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
