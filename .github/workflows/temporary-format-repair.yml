name: Temporary repository formatting repair

on:
  push:
    branches:
      - chore/format-repository-baseline

permissions:
  contents: write

concurrency:
  group: format-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout formatting branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --progress=false --fetch-timeout=60000 --fetch-retries=2
      - name: Format all files rejected by the TSIC full-repository gate
        run: |
          npx prettier --write \
            app/detection/page.tsx \
            app/globals.css \
            app/how-it-works/page.tsx \
            app/manifest.ts \
            app/not-found.tsx \
            app/page.tsx \
            app/product/page.tsx \
            components/layout/page-shell.tsx \
            components/marketing/behavioral-lab.tsx \
            components/marketing/signal-visualization.tsx \
            components/navigation/site-header.tsx \
            components/ui/tf-primitives.tsx \
            docs/growth/THREATFADE-COMMERCIAL-FLYWHEEL.md \
            docs/growth/THREATFADE-CONVERSION-FLYWHEEL.md \
            docs/growth/THREATFADE-CUSTOMER-VALUE-FLYWHEEL.md \
            docs/growth/THREATFADE-DEMAND-INTELLIGENCE-FLYWHEEL.md \
            docs/growth/THREATFADE-PRODUCT-OSS-FLYWHEEL.md \
            docs/growth/THREATFADE-RESEARCH-FLYWHEEL.md \
            docs/growth/THREATFADE-TRUST-EVIDENCE-LAYER.md \
            docs/PHASE-0-INTELLIGENCE-ARCHITECTURE.md \
            docs/strategy/COMMERCIAL-FLYWHEEL.md \
            docs/strategy/CONTENT-FLYWHEEL.md \
            docs/strategy/CONVERSION-FLYWHEEL.md \
            lib/validation/engine.ts
      - name: Verify full-repository formatting
        run: npx prettier --check .
      - name: Commit formatting-only changes
        run: |
          if git diff --quiet; then
            echo "Repository already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components docs lib
          git commit -m "style: format full ThreatFade Web repository baseline"
          git push origin HEAD:${GITHUB_REF_NAME}
