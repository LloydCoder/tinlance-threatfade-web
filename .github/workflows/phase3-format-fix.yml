name: Phase 3 Format Fix

on:
  push:
    branches: [phase-3-soc-platform]

permissions:
  contents: write

jobs:
  format:
    if: github.actor == 'LloydCoder'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write app/api/analyst/[...path]/route.ts app/soc/page.tsx app/soc/[id]/page.tsx app/soc/[id]/timeline/page.tsx config/site.ts
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --quiet; then exit 0; fi
          git add app/api/analyst app/soc config/site.ts
          git commit -m "style: format phase 3 SOC web files"
          git push origin HEAD:phase-3-soc-platform
