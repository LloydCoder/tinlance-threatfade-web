name: Phase 9 Format Repair

on:
  push:
    branches:
      - feat/phase9-seo-ai-discovery

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Format Phase 9 files
        run: >-
          npx prettier --write
          app/detection/[topic]/page.tsx
          app/detection/layout.tsx
          app/docs/[slug]/page.tsx
          app/docs/layout.tsx
          app/enterprise/layout.tsx
          app/how-it-works/layout.tsx
          app/integrations/layout.tsx
          app/layout.tsx
          app/playground/layout.tsx
          app/product/layout.tsx
          app/research/[slug]/page.tsx
          app/security/layout.tsx
          config/seo-topics.ts
          lib/seo/json-ld.ts
      - name: Commit formatting repair
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app config lib
          git commit -m "style(seo): apply Prettier formatting"
          git push
