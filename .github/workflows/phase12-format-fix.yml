name: Phase 12 Format Fix

on:
  push:
    branches: [phase-3-soc-platform]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip phase12-format]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write app/api/analyst/'[...path]'/route.ts app/soc/'[id]'/page.tsx app/soc/page.tsx docs/growth/THREATFADE-COMMERCIAL-FLYWHEEL.md docs/growth/THREATFADE-CONVERSION-FLYWHEEL.md docs/growth/THREATFADE-CUSTOMER-VALUE-FLYWHEEL.md docs/growth/THREATFADE-DEMAND-INTELLIGENCE-FLYWHEEL.md docs/growth/THREATFADE-PRODUCT-OSS-FLYWHEEL.md docs/growth/THREATFADE-RESEARCH-FLYWHEEL.md docs/growth/THREATFADE-TRUST-EVIDENCE-LAYER.md docs/strategy/COMMERCIAL-FLYWHEEL.md docs/strategy/CONTENT-FLYWHEEL.md docs/strategy/CONVERSION-FLYWHEEL.md
      - name: Commit formatted phase files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/analyst app/soc docs/growth/THREATFADE-*.md docs/strategy/COMMERCIAL-FLYWHEEL.md docs/strategy/CONTENT-FLYWHEEL.md docs/strategy/CONVERSION-FLYWHEEL.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(phase12): apply Prettier formatting [skip phase12-format]"
          git push origin HEAD:phase-3-soc-platform
