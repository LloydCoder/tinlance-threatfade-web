name: Phase 15 format fix

on:
  push:
    branches: [phase-15-conversion-engine]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'LloydCoder/tinlance-threatfade-web' && github.ref == 'refs/heads/phase-15-conversion-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --progress=false --fetch-timeout=60000 --fetch-retries=2
      - run: npx prettier --write app/account/conversion/page.tsx app/api/analytics/event/route.ts app/api/leads/route.ts app/assessment/page.tsx app/enterprise/page.tsx app/pilot/page.tsx components/analytics/conversion-tracker.tsx components/analytics/lead-capture-form.tsx docs/PHASE-15-CONVERSION-ENGINE.md lib/analytics/provider.ts lib/analytics/taxonomy.test.ts lib/analytics/taxonomy.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/account/conversion/page.tsx app/api/analytics/event/route.ts app/api/leads/route.ts app/assessment/page.tsx app/enterprise/page.tsx app/pilot/page.tsx components/analytics/conversion-tracker.tsx components/analytics/lead-capture-form.tsx docs/PHASE-15-CONVERSION-ENGINE.md lib/analytics/provider.ts lib/analytics/taxonomy.test.ts lib/analytics/taxonomy.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(phase15): apply repository Prettier formatting"
          git push origin HEAD:phase-15-conversion-engine
