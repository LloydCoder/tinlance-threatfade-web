name: Phase 15 format fix

on:
  push:
    branches: [phase-15-conversion-engine]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'LloydCoder/tinlance-threatfade-web' && github.ref == 'refs/heads/phase-15-conversion-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --progress=false --fetch-timeout=60000 --fetch-retries=2
      - run: npx prettier --write app/layout.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+LloydCoder@users.noreply.github.com"
          git add app/layout.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(phase15): format Suspense fix"
          git push origin HEAD:phase-15-conversion-engine
