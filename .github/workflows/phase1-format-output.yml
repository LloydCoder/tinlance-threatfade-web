name: Phase 1 Format Output

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "components/detection/correlation-evidence-view.tsx"

permissions:
  contents: read

jobs:
  format-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prettier components/detection/correlation-evidence-view.tsx
