name: Phase 14 formatter

on:
  push:
    branches: [phase-14-commercialization]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'LloydCoder/tinlance-threatfade-web' && github.ref == 'refs/heads/phase-14-commercialization'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout owned Phase 14 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Format Phase 14 files
        run: npx prettier --write README.md app/assessment/page.tsx app/changelog/page.tsx app/enterprise/page.tsx app/managed/page.tsx app/pilot/page.tsx app/pricing/page.tsx components/analytics/conversion-link.tsx docs/PHASE-14-COMMERCIALIZATION.md docs/growth/THREATFADE-COMMERCIAL-RESEARCH.md
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git add README.md app/assessment/page.tsx app/changelog/page.tsx app/enterprise/page.tsx app/managed/page.tsx app/pilot/page.tsx app/pricing/page.tsx components/analytics/conversion-link.tsx docs/PHASE-14-COMMERCIALIZATION.md docs/growth/THREATFADE-COMMERCIAL-RESEARCH.md
          git commit -m "style(phase14): apply repository Prettier formatting"
          git push origin HEAD:phase-14-commercialization
